<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSC পাঠ্যপুস্তক সমগ্র</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: linear-gradient(135deg, #0f172a, #172554, #0f172a);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      text-align: center;
      padding: 50px 20px 20px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 20px 0 50px;
    }

    .subject-card {
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      text-decoration: none;
      color: white;
      transition: all 0.3s ease;
    }

    .subject-card:hover {
      border-color: #3b82f6;
      transform: translateY(-5px);
    }

    .subject-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .subject-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subject-desc {
      color: #94a3b8;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      padding: 25px;
      font-size: 13px;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 HSC পাঠ্যপুস্তক সমগ্র</h1>
    <p>একাদশ-দ্বাদশ শ্রেণির শিক্ষার্থীদের জন্য অনলাইন লাইব্রেরি</p>
  </header>

  <div class="container">
    <!-- বাংলা বিষয়ের কার্ড -->
    <a href="bangla.html" class="subject-card">
      <div class="subject-icon">📖</div>
      <div class="subject-title">বাংলা</div>
      <div class="subject-desc">প্রথম ও দ্বিতীয় পত্র</div>
    </a>

    <!-- ইংরেজি বিষয়ের কার্ড (পরে তৈরি করা যাবে) -->
    <a href="#" class="subject-card">
      <div class="subject-icon">🇬🇧</div>
      <div class="subject-title">ইংরেজি</div>
      <div class="subject-desc">প্রথম ও দ্বিতীয় পত্র</div>
    </a>

    <!-- আইসিটি বিষয়ের কার্ড (পরে তৈরি করা যাবে) -->
    <a href="#" class="subject-card">
      <div class="subject-icon">💻</div>
      <div class="subject-title">ICT</div>
      <div class="subject-desc">তথ্য ও যোগাযোগ প্রযুক্তি</div>
    </a>
  </div>

  <footer>
    © 2026 HSC পাঠ্যপুস্তক সমগ্র
  </footer>

</body>
  </html>
